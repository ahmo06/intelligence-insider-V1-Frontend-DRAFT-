.ak-Header {
  all: revert;
}

.ak-Header {
  margin-top: 16px;
  
  .ak-Logo {
    display: none;
  }
  
  .ak-Heading {
    font-size: 0;
    text-align: left;
    margin-bottom: 20px;

    &:before {
      content: 'Welcome to Cursor';
      font-weight: 400;
      font-size: var(--font-size-6);
    }

    &:after {
      content: 'The new way to build software';
      font-weight: 400;
      font-size: var(--font-size-6); 
      margin-top: -50px;       
    }
    
    .dark-theme &:after {
      color: #474641;      
    }

    .light-theme &:after {
      color: var(--gray-8);      
    }
  }
}

.ak-Card {
  all: revert;
  &::after, &::before { all: unset; }
}

.ak-Card {
  .ak-TextSeparator {
    display: none;
  }
  .ak-AuthForm {
    order: 5;
  }

}

.ak-PrimaryButton {
    .dark-theme & {
    background-color: #19180E;
    color: #FFF;
    box-shadow: none;
  }

}

.ak-AuthButton {
    .dark-theme & {
    background-color: #19180E;
    color: #FFF;
    box-shadow: none;
  }

}

.ak-TextField {
    .dark-theme & {
    border: 1px solid #19180E;
    background-color: #14120E;
    & input::placeholder {
      color: #31312C;
    }
  }

}

.ak-Label {
    color: #6F6F6F;
}

.ak-OrgSelection {
  
}

.ak-Callout {
  
}

.ak-Footer {
  color: #6F6F6F;
  & a {
    color: #6F6F6F;
  }
}
